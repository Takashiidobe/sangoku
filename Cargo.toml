[package]
name = "sangoku"
version = "0.1.0"
edition = "2024"
autoexamples = false
default-run = "sangoku"

[workspace]
members = ["tests/support", "tools/lower", "runtime/console", "runtime/audio", "runtime/vec"]
exclude = [
  "third_party/rust",
  "third_party/wasmtime",
  "third_party/rustc_codegen_cranelift",
]
resolver = "3"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
miette = { version = "7.6.0", features = ["fancy"] }
rustc-demangle = "0.1.28"
serde_json = "1"
sha2 = "0.11"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"

[dev-dependencies]
sangoku-test-support = { path = "tests/support" }
sangoku-audio = { path = "runtime/audio" }
sangoku-vec = { path = "runtime/vec" }

[[example]]
name = "audit-runtime"
path = "tests/bin/audit_runtime.rs"

[[example]]
name = "audit-division"
path = "tests/bin/audit_division.rs"

[[example]]
name = "audit-popcount"
path = "tests/bin/audit_popcount.rs"

[[example]]
name = "check-spills"
path = "tests/bin/check_spills.rs"

[[example]]
name = "check-popcount"
path = "tests/bin/check_popcount.rs"

[[example]]
name = "generate-popcount-baselines"
path = "tests/bin/generate_popcount_baselines.rs"

[[example]]
name = "audit-shifts"
path = "tests/bin/audit_shifts.rs"

[[example]]
name = "audit-memory-inline"
path = "tests/bin/audit_memory_inline.rs"

[[example]]
name = "audit-move-compare"
path = "tests/bin/audit_move_compare.rs"

[[example]]
name = "audit-optimizations"
path = "tests/bin/audit_optimizations.rs"
